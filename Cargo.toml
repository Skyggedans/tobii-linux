# Workspace root. The crates split along the production / research boundary:
# the daemon stack (tobii-proto -> tobii-pose -> tobii-usb -> tobiid), the
# client-facing pieces (tobii-ipc, tobii-ffi, tobii-clients) and the research
# CLI (tobii-tools). See INSTALL.md for the layout.
[workspace]
# Resolver 3 is not the default for a virtual manifest; without it the feature
# unification of ort/rusb would silently change.
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
ort = "2.0.0-rc.10"
rusb = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tobii-ffi = { path = "crates/tobii-ffi" }
tobii-pose = { path = "crates/tobii-pose" }
tobii-proto = { path = "crates/tobii-proto" }
tobii-usb = { path = "crates/tobii-usb" }
tobii-ipc = { path = "crates/tobii-ipc" }
tobii-log = { path = "crates/tobii-log" }

# rust-skills: lint-deny-correctness, lint-warn-{suspicious,style,complexity,perf},
# lint-pedantic-selective, lint-cfg-check, lint-missing-docs, lint-unsafe-doc.
# Every member opts in with `[lints] workspace = true`; a member that forgets
# silently loses the whole table, so keep `make check` honest.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# pedantic, selectively (see rust-skills lint-pedantic-selective)
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
doc_markdown = "warn"
float_cmp = "warn"
manual_let_else = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
undocumented_unsafe_blocks = "warn"
# unwrap in non-test code: rust-skills err-no-unwrap-prod / anti-unwrap-abuse
unwrap_used = "warn"

# rust-skills opt-lto-release / opt-codegen-units / perf-release-profile.
# A profile in a member manifest is ignored, so this must stay at the root.
# panic stays "unwind": the daemon's watchdog recovers a panicked engine
# thread, and extern "C" fns already abort on unwind.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
