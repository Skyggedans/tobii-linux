[package]
name = "tobii-pose"
description = "Head pose from the tracker's IR frames: MediaPipe face landmarks and a perspective fit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not the workspace's MIT alone: the crate embeds MediaPipe's face-landmark
# and face-detection models and canonical face mesh, which are Apache-2.0
# (models/LICENSE, models/NOTICE, provenance in models/README.md).
license = "MIT AND Apache-2.0"
publish.workspace = true

[dependencies]
anyhow.workspace = true
ort.workspace = true
tracing.workspace = true

# Tests only: the fixtures are raw 0x50e stream messages that have to be
# decoded before they can be fed to the tracker.
[dev-dependencies]
tobii-proto.workspace = true

[lints]
workspace = true
